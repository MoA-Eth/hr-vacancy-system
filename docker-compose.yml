services:
  db:
    image: postgres:15-alpine
    container_name: hr_vacancy_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hr_network
    restart: unless-stopped

  backend:
    build:
      context: ./Backend/hr_vacancy_system
      dockerfile: Dockerfile
    container_name: hr_vacancy_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 hr_vacancy_system.wsgi:application"
    volumes:
      - ./Backend/hr_vacancy_system:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      - db
    networks:
      - hr_network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/frontend
      dockerfile: Dockerfile
    container_name: hr_vacancy_frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - hr_network
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: hr_vacancy_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - media_volume:/app/media:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hr_network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  hr_network:
    driver: bridge