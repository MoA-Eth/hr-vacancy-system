upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name jobportal.moa.gov.et 196.191.93.56;

    client_max_body_size 10M;

    # ---------- Django API ----------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django Admin ----------
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Uploaded files (resumes, transcripts, ...) ----------
    # Served directly by Nginx from the shared volume.
    # Path must match MEDIA_ROOT inside the backend container.
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- Django static files (admin CSS/JS, DRF, ...) ----------
    # Path must match STATIC_ROOT inside the backend container.
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- Frontend (React/Vue/etc.) ----------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}