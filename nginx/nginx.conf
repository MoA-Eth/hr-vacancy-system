upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# ---------- HTTP: redirect everything to HTTPS ----------
server {
    listen 80 default_server;
    server_name jobportal.moa.gov.et 196.191.93.56;

    return 301 https://jobportal.moa.gov.et$request_uri;
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    http2 on;
    server_name jobportal.moa.gov.et;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 25M;

    # ---------- Django API ----------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django Admin ----------
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Uploaded files (resumes, transcripts, ...) ----------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- Django static files ----------
    # Requires STATIC_URL = '/django-static/' in Django settings.
    location /django-static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- Frontend (React) ----------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}